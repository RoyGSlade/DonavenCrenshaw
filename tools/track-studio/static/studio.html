<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#04060a">
<meta name="robots" content="noindex, nofollow">
<title>Track Studio</title>
<link rel="stylesheet" href="/studio/studio.css">
</head>
<body>
<canvas id="board" role="img" aria-label="Track design canvas. Draw with one finger, pan and zoom with two."></canvas>

<header class="topbar">
  <button type="button" id="menu-btn" class="icon" aria-label="Track settings and designs">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button type="button" id="title-btn" class="title-btn" aria-label="Rename the track">
    <span id="doc-title">Untitled track</span>
    <span id="save-state" class="save" role="status" aria-live="polite">New</span>
  </button>
  <button type="button" id="layers-btn" class="icon" aria-label="Layers">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5"/></svg>
  </button>
  <button type="button" id="check-btn" class="icon check" aria-label="Checks">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>
    <span id="check-badge" class="badge" hidden>0</span>
  </button>
  <button type="button" id="tracks-btn" class="text">Tracks</button>
  <button type="button" id="make-btn" class="text primary">Make</button>
</header>

<p id="banner" class="banner" hidden></p>
<p id="toast" class="toast" role="status" aria-live="polite" hidden></p>

<div class="floaters left">
  <button type="button" id="undo" class="float" aria-label="Undo" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-4"/></svg>
  </button>
  <button type="button" id="redo" class="float" aria-label="Redo" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5M20 9H9a5 5 0 0 0 0 10h4"/></svg>
  </button>
</div>
<div class="floaters">
  <button type="button" id="fit-btn" class="float" aria-label="Fit the track on screen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
  </button>
  <button type="button" id="game-btn" class="float" aria-pressed="false" aria-label="Show what the game will fly">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 20l8-4 8 4-8-17Z"/></svg>
  </button>
</div>

<footer class="dockbar">
  <p id="hint" class="hint" aria-live="polite"></p>
  <div id="sub" class="sub" role="toolbar" aria-label="Tool options"></div>
  <nav id="dock" class="dock" role="toolbar" aria-label="Tools">
    <button type="button" class="tool" data-tool="lane" aria-pressed="true"><i class="dot lane"></i>Lane</button>
    <button type="button" class="tool" data-tool="width" aria-pressed="false"><i class="dot width"></i>Width</button>
    <button type="button" class="tool" data-tool="obstacles" aria-pressed="false"><i class="dot obstacles"></i>Obstacle</button>
    <button type="button" class="tool" data-tool="shards" aria-pressed="false"><i class="dot shards"></i>Shards</button>
    <button type="button" class="tool" data-tool="landmarks" aria-pressed="false"><i class="dot landmarks"></i>Landmark</button>
    <button type="button" class="tool" data-tool="hazards" aria-pressed="false"><i class="dot hazards"></i>Zone</button>
    <button type="button" class="tool" data-tool="notes" aria-pressed="false"><i class="dot notes"></i>Note</button>
    <button type="button" class="tool" data-tool="stamp" aria-pressed="false"><i class="dot stamp"></i>Stamp</button>
    <button type="button" class="tool" data-tool="select" aria-pressed="false"><i class="dot select"></i>Select</button>
  </nav>
</footer>

<!-- Sheets. Contents are built by studio.js (textContent only). -->
<dialog id="dlg-track" class="sheet" aria-labelledby="dlg-track-h">
  <div class="sheet-head"><h2 id="dlg-track-h">Track</h2><button type="button" class="close" data-close aria-label="Close">×</button></div>
  <div class="sheet-body" id="track-body"></div>
</dialog>
<dialog id="dlg-layers" class="sheet" aria-labelledby="dlg-layers-h">
  <div class="sheet-head"><h2 id="dlg-layers-h">Layers</h2><button type="button" class="close" data-close aria-label="Close">×</button></div>
  <div class="sheet-body" id="layers-body"></div>
</dialog>
<dialog id="dlg-check" class="sheet" aria-labelledby="dlg-check-h">
  <div class="sheet-head"><h2 id="dlg-check-h">Checks</h2><button type="button" class="close" data-close aria-label="Close">×</button></div>
  <div class="sheet-body" id="check-body"></div>
</dialog>
<dialog id="dlg-tracks" class="sheet tall" aria-labelledby="dlg-tracks-h">
  <div class="sheet-head"><h2 id="dlg-tracks-h">Tracks</h2><button type="button" class="close" data-close aria-label="Close">×</button></div>
  <div class="sheet-body" id="tracks-body"></div>
</dialog>
<dialog id="dlg-props" class="sheet" aria-labelledby="dlg-props-h">
  <div class="sheet-head"><h2 id="dlg-props-h">Properties</h2><button type="button" class="close" data-close aria-label="Close">×</button></div>
  <div class="sheet-body" id="props-body"></div>
</dialog>
<dialog id="dlg-ask" class="sheet" aria-labelledby="dlg-ask-h">
  <div class="sheet-head"><h2 id="dlg-ask-h">Note</h2><button type="button" class="close" data-close aria-label="Close">×</button></div>
  <div class="sheet-body" id="ask-body"></div>
</dialog>

<dialog id="dlg-request" class="sheet tall" aria-labelledby="dlg-request-h">
  <div class="sheet-head"><h2 id="dlg-request-h">Request something new</h2><button type="button" class="close" data-close aria-label="Close">×</button></div>
  <form class="sheet-body" id="request-form" novalidate>
    <label for="rq-title">Title</label>
    <input id="rq-title" type="text" maxlength="80" autocomplete="off" required placeholder="Broken escalator">
    <label for="rq-desc">Description</label>
    <textarea id="rq-desc" rows="3" maxlength="2000" placeholder="What is it? What happens?"></textarea>
    <label for="rq-effect">Effect on the player</label>
    <textarea id="rq-effect" rows="2" maxlength="600" placeholder="Knocks you sideways, slows you, blocks half the lane…"></textarea>
    <label for="rq-need">Need / why</label>
    <textarea id="rq-need" rows="2" maxlength="600" placeholder="Why the track needs it"></textarea>
    <fieldset class="chips-field"><legend>Type</legend><div id="rq-type" class="chips"></div></fieldset>
    <fieldset class="chips-field"><legend>Behaviour</legend><div id="rq-behavior" class="chips"></div></fieldset>
    <fieldset class="form-grid"><legend>Form</legend>
      <label for="rq-size">Size</label><input id="rq-size" type="text" maxlength="80" autocomplete="off" placeholder="Two lanes long">
      <label for="rq-shape">Shape</label><input id="rq-shape" type="text" maxlength="120" autocomplete="off" placeholder="Stairs, ring, slab…">
      <label for="rq-look">Look</label><input id="rq-look" type="text" maxlength="400" autocomplete="off" placeholder="Rusty chrome, neon sign…">
    </fieldset>
    <fieldset class="chips-field"><legend>Sketch</legend>
      <div id="rq-sketch-mode" class="chips"></div>
      <canvas id="rq-pad" class="rq-pad" aria-label="Quick sketch pad"></canvas>
      <div class="row" id="rq-pad-tools"></div>
    </fieldset>
    <label for="rq-photo">Photo (optional)</label>
    <input id="rq-photo" type="file" accept="image/*">
    <img id="rq-photo-preview" class="rq-photo" alt="" hidden>
    <label class="check"><input id="rq-3d" type="checkbox"> Needs a 3D / visual asset (queue it)</label>
    <p id="rq-where" class="muted"></p>
    <p id="rq-msg" class="msg" role="status" aria-live="polite"></p>
    <div class="row end">
      <button type="button" data-close>Cancel</button>
      <button type="submit" id="rq-save" class="primary">Save request</button>
    </div>
  </form>
</dialog>

<script type="module" src="/studio/studio.js"></script>
</body>
</html>
