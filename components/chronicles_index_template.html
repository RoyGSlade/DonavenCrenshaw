<!DOCTYPE html>
<html lang="en">

<head>
    <link rel='icon' type='image/png' sizes='32x32' href='{{SITE_ROOT}}assets/favicon/favicon-32x32.png'>
    <link rel='icon' type='image/png' sizes='16x16' href='{{SITE_ROOT}}assets/favicon/favicon-16x16.png'>
    <link rel='apple-touch-icon' sizes='180x180' href='{{SITE_ROOT}}assets/favicon/apple-touch-icon.png'>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CHRONICLES | SOURCE ARCANUM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Fira+Code:wght@300;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{SITE_ROOT}}styles/styles.css">
</head>

<body>

    <nav>
        {{NAV}}
    </nav>

    <div class="content-wrapper">
        <header class="container hero"
            style="min-height: 40vh; justify-content: center; display: flex; flex-direction: column;">
            <div class="hero-content">
                <div class="pre-title mono" style="color: var(--accent-gold);">// LOGS FROM THE RESISTANCE</div>
                <h1 style="font-size: 3.5rem; margin-bottom: 1rem;">THE CHRONICLES</h1>
                <div class="tagline" style="border-left: 3px solid var(--accent-gold); padding-left: 1.5rem;">
                    <p style="font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text-main);">
                        Thoughts on software, independence, and the future.
                    </p>
                    <div class="mono"
                        style="margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem; border-top: 1px dotted var(--stone-dark); padding-top: 1rem;">
                        > STATUS: UP-TO-DATE<br>
                        > TOTAL ENTRIES: {{TOTAL_ENTRIES}}
                    </div>
                </div>
            </div>
        </header>

        <main class="container" style="margin-bottom: 8rem; max-width: 900px;">
            <div class="chronicles-feed">
                {{CHRONICLES_FEED}}
            </div>
        </main>

        <footer>
            {{FOOTER}}
        </footer>
    </div> <!-- END CONTENT WRAPPER -->

</body>

</html>
