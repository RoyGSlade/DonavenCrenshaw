<!DOCTYPE html>
<html lang="en">

<head>
    <link rel='icon' type='image/png' sizes='32x32' href='{{SITE_ROOT}}assets/favicon/favicon-32x32.png'>
    <link rel='icon' type='image/png' sizes='16x16' href='{{SITE_ROOT}}assets/favicon/favicon-16x16.png'>
    <link rel='apple-touch-icon' sizes='180x180' href='{{SITE_ROOT}}assets/favicon/apple-touch-icon.png'>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | SOURCE ARCANUM CHRONICLES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Fira+Code:wght@300;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{SITE_ROOT}}styles/styles.css">
</head>

<body>

    <nav>
        {{NAV}}
    </nav>

    <div class="content-wrapper">
        <header class="container hero"
            style="min-height: 40vh; justify-content: center; display: flex; flex-direction: column;">
            <div class="hero-content">
                <div class="pre-title mono" style="color: var(--accent-gold);">{{DATE}}</div>
                <h1 style="font-size: 3rem; margin-bottom: 1rem;">{{TITLE}}</h1>
                <div class="tagline" style="border-left: 3px solid var(--accent-gold); padding-left: 1.5rem;">
                    <p class="mono" style="color: var(--text-muted); font-size: 0.9rem;">
                        // AUTHOR: {{AUTHOR}}<br>
                        // TAGS: {{TAGS}}
                    </p>
                </div>
            </div>
        </header>

        <main class="container" style="margin-bottom: 8rem; max-width: 800px;">
            <article class="reading-text" style="font-size: 1.15rem; line-height: 1.8;">
                {{CONTENT}}
            </article>

            <div style="margin-top: 4rem; text-align: center;">
                <a href="{{SITE_ROOT}}chronicles.html" class="mono btn"
                    style="color: var(--accent-gold); text-decoration: none; border: 1px solid var(--accent-gold); padding: 0.5rem 1rem;">
                    &larr; BACK TO CHRONICLES
                </a>
            </div>
        </main>

        <footer>
            {{FOOTER}}
        </footer>
    </div> <!-- END CONTENT WRAPPER -->

</body>

</html>
