<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070d17">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../art/player-ship.png">
  <title>The Hangar · Stardust</title>
  <meta name="description" content="The new Stardust: your ship, your captain and the jobs that pay for both. Not open yet.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2381e6df' d='M16 1 30 30 16 23 2 30Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./voyage.css">
  <link rel="stylesheet" href="./quests/ui/player.css">
  <link rel="stylesheet" href="./crew/crew.css">
  <link rel="stylesheet" href="./ui/kit.css">
  <link rel="stylesheet" href="./onfoot/onfoot.css">
  <link rel="stylesheet" href="./story/story.css">
  <link rel="stylesheet" href="./shops/shop.css">
</head>
<body>
  <main id="hg-floor" class="of-stage hg-floor" aria-label="The hangar floor. Walk with WASD or the arrow keys, E to use; on a phone, the stick and the button."></main>
  <header class="vy-top hg-top">
    <a href="../?activity=classic" id="vy-back">← CLASSIC</a>
    <h1 class="vy-wordmark">STARDUST <b>/</b> THE HANGAR</h1>
    <span id="vy-sync" class="vy-chip" role="status">Saved on this device</span>
    <div class="hg-tools">
      <button type="button" id="hg-settings-btn" class="ui-btn hg-icon-btn" aria-expanded="false" aria-controls="hg-settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <section id="vy-closed" class="vy-closed" hidden aria-labelledby="vy-closed-title">
    <p class="vy-eyebrow">COMING LATER</p>
    <h2 id="vy-closed-title">The new Stardust is not open yet.</h2>
    <p>Jobs, a captain of your own and a ship you upgrade. It is still being built.</p>
    <a class="vy-link" href="../">Back to the hangar</a>
  </section>

  <div id="vy-hangar" class="vy-hangar hg-place" hidden>
    <h2 class="hg-sr">The hangar. Walk up to a station, or pick one here to open it.</h2>
    <p id="hg-objective" class="hg-objective ui-nameplate" role="status" hidden><b>NEXT</b><span></span></p>
    <nav id="hg-spots" class="hg-layer" aria-label="Hangar stations"></nav>
    <section id="hg-sheet" class="hg-sheet ui-panel" role="region" aria-labelledby="hg-sheet-title" hidden>
      <header class="hg-sheet-head">
        <div><p class="ui-eyebrow" id="hg-sheet-who"></p><h2 id="hg-sheet-title"></h2></div>
        <button type="button" id="hg-sheet-close" class="hg-sheet-close" aria-label="Close station">✕</button>
      </header>
      <nav id="hg-sheet-tabs" class="hg-subtabs" aria-label="Station views" hidden></nav>
      <div class="hg-sheet-body">
        <section id="pane-ship" class="vy-pane" hidden></section>
        <section id="pane-jobs" class="vy-pane vy-jobs-pane" hidden></section>
        <section id="pane-captain" class="vy-pane" hidden></section>
        <section id="pane-ledger" class="vy-pane" hidden></section>
        <section id="pane-crew" class="vy-pane" hidden></section>
        <section id="pane-station" class="vy-pane" hidden></section>
        <section id="pane-mount" class="vy-pane" hidden></section>
      </div>
    </section>
    <section id="vy-dev" class="vy-dev" hidden aria-label="Test tools"></section>
  </div>
  <section id="hg-settings" class="hg-settings ui-panel" hidden aria-label="Settings"></section>
  <section id="hg-licence" class="hg-licence" hidden aria-labelledby="hg-licence-title"></section>
  <div id="hg-dialogue" class="ui-dialogue" hidden></div>
  <div id="hg-attempt" hidden></div>
  <div id="vy-toast" class="vy-toast" role="status" aria-live="polite"></div>
  <script type="module" src="./boot.js"></script>
</body>
</html>
