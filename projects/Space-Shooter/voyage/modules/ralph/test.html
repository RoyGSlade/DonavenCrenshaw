<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ralph: test page</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0a1119;color:#eaf4f5;font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
  .tp{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  .tp h2{margin:0 0 4px;font:800 20px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#ffd9b0}
  .tp p.lead{margin:0 0 16px;color:#9db3c2}
  .tp fieldset{border:1px solid #3f5566;border-radius:6px;margin:0 0 14px;padding:10px 12px;background:#0b1724}
  .tp legend{padding:0 6px;font:700 11px Consolas,monospace;letter-spacing:.14em;color:#81e6df;text-transform:uppercase}
  .tp .row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  .tp label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:#9db3c2}
  .tp input,.tp select,.tp textarea{font:14px Inter,sans-serif;color:#eaf4f5;background:#0a1624;border:1px solid #3f5566;border-radius:4px;padding:6px 8px}
  .tp input[type=number]{width:84px}
  .tp label.check{flex-direction:row;align-items:center;gap:6px}
  .tp textarea{width:100%;min-height:160px;font:12px Consolas,monospace}
  .tp .go{font:800 15px Inter,sans-serif;letter-spacing:.08em;padding:12px 26px;border-radius:4px;border:0;background:#81e6df;color:#062226;cursor:pointer}
  .tp pre{margin:6px 0 0;padding:10px;background:#07111c;border:1px solid #3f5566;border-radius:4px;white-space:pre-wrap;word-break:break-word;font:12px Consolas,monospace;max-height:260px;overflow:auto}
  .host{position:fixed;inset:0;z-index:1000;background:#05090e}
  .host[hidden]{display:none}
  #stage{position:absolute;inset:0}
  .leave{position:fixed;z-index:1001;top:10px;right:10px;min-width:44px;min-height:44px;padding:0 16px;font:800 12px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#eaf4f5;background:#0b1724e6;border:1px solid #81e6df;border-radius:22px;cursor:pointer}
</style>
</head>
<body>
<main class="tp" id="panel">
  <h2>Ralph: test page</h2>
  <p class="lead">Plays the module with a fake host: a full-screen stage, a Leave button, and sounds played through <code>ctx.sound</code> from <code>audio.js</code>.</p>
  <fieldset><legend>Ralph's record</legend>
    <div class="row">
      <label>Fixture <select id="fixture"></select></label>
      <label>Mood <input id="mood" type="number" min="0" max="100"></label>
      <label>Bond <input id="bond" type="number" min="0" max="5"></label>
      <label>Bone <input id="bone" type="number" min="0" max="9"></label>
      <label>Kibble <input id="kibble" type="number" min="0" max="9"></label>
      <label class="check"><input id="asleep" type="checkbox"> Asleep</label>
      <label class="check"><input id="quick" type="checkbox"> Quick mode</label>
      <label class="check"><input id="sfx" type="checkbox" checked> Play sounds</label>
    </div>
  </fieldset>
  <fieldset><legend>Roll (ignored: Ralph has no skill)</legend>
    <div class="row">
      <label>Seed <input id="seed" type="number" value="1" step="1"></label>
      <label>Tier <select id="tier"><option value="-2">-2 Rough</option><option value="-1">-1 Shaky</option><option value="0" selected>0 Steady</option><option value="1">+1 Good</option><option value="2">+2 Smooth</option></select></label>
      <label>Points (speed, quality, material) <input id="points" value="0,0,0"></label>
    </div>
  </fieldset>
  <details><summary>Context (JSON, editable)</summary><textarea id="ctx" spellcheck="false"></textarea></details>
  <p><button class="go" id="go" type="button">Play</button></p>
  <fieldset><legend>Result</legend><pre id="result">(nothing yet)</pre></fieldset>
  <fieldset><legend>Sounds asked for</legend><pre id="sounds">(none)</pre></fieldset>
</main>
<div class="host" id="host" hidden><div id="stage"></div><button class="leave" id="leave" type="button">Leave</button></div>
<script type="module">
import { play } from './index.js';
import { createSfx } from './audio.js';
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const fixtures = (await (await fetch('fixtures.json')).json()).fixtures;
for (const [k, f] of Object.entries(fixtures)) $('fixture').append(new Option(f.label, k));
const sfx = createSfx(); window.__sfx = sfx;
const sounds = []; window.__sounds = sounds; window.__stops = 0;
const ctxText = $('ctx');
function loadFixture(k) {
  const c = structuredClone(fixtures[k].context); ctxText.value = JSON.stringify(c, null, 2);
  $('mood').value = c.ralph?.mood ?? 50; $('bond').value = c.ralph?.bond ?? 1; $('asleep').checked = !!c.ralph?.asleep;
  $('bone').value = c.save?.items?.bone ?? 0; $('kibble').value = c.save?.items?.kibble ?? 0;
}
$('fixture').addEventListener('change', () => loadFixture($('fixture').value));
const fx = q.get('fixture') && fixtures[q.get('fixture')] ? q.get('fixture') : 'friend';
$('fixture').value = fx; loadFixture(fx);
for (const k of ['seed', 'tier', 'mood', 'bond', 'bone', 'kibble']) if (q.has(k)) $(k).value = q.get(k);
if (q.get('asleep') === '1') $('asleep').checked = true;
if (q.get('quick') === '1') $('quick').checked = true;
if (q.get('mute') === '1') $('sfx').checked = false;
let leaveHandler = null, leaveDefault = null;
async function start() {
  let context;
  try { context = JSON.parse(ctxText.value); } catch (e) { $('result').textContent = `The context is not valid JSON: ${e.message}`; return; }
  context.ralph = { ...(context.ralph || {}), mood: Number($('mood').value), bond: Number($('bond').value), asleep: $('asleep').checked };
  context.save = { ...(context.save || {}), items: { ...(context.save?.items || {}), bone: Number($('bone').value) || 0, kibble: Number($('kibble').value) || 0 } };
  if (q.has('lastSeen')) context.ralph.lastSeen = context.now - Number(q.get('lastSeen')) * 86400000;
  if (q.has('finds')) context.ralph.finds = [{ item: 'loose-bolt', chance: Number(q.get('finds')) }];
  if (q.has('spot')) context.ralph.spot = q.get('spot');
  const pts = $('points').value.split(',').map(Number);
  const ctx = {
    seed: Number($('seed').value) || 1, tier: Number($('tier').value) || 0, points: { speed: pts[0] || 0, quality: pts[1] || 0, material: pts[2] || 0 }, level: 1,
    quick: $('quick').checked, mode: 'field', context,
    sound: (id) => { sounds.push(id); if (id === 'ralph-stop') window.__stops++; $('sounds').textContent = sounds.slice(-40).join('\n'); if ($('sfx').checked) sfx.play(id); },
    reducedMotion: () => q.get('reduced') === '1',
    debugForce: q.get('force') ? { style: q.get('force').startsWith('find') ? null : q.get('force'), find: q.get('force') === 'find' ? 'loose-bolt' : null } : undefined,
  };
  sounds.length = 0; window.__stops = 0;
  $('panel').hidden = true; $('host').hidden = false;
  window.__result = null; window.__leaveRegistered = 0; leaveHandler = null;
  const left = new Promise((r) => { leaveDefault = r; });
  if (!q.has('noleave')) ctx.onLeave = (fn) => { leaveHandler = fn; window.__leaveRegistered += 1; };
  const result = await Promise.race([play($('stage'), ctx), left]);
  window.__result = result; sfx.stop();
  $('host').hidden = true; $('panel').hidden = false; $('result').textContent = JSON.stringify(result, null, 2);
}
$('go').addEventListener('click', start);
$('leave').addEventListener('click', () => (leaveHandler ? leaveHandler() : leaveDefault?.({ done: true, left: true })));
if (q.get('autoplay') === '1') start();
</script>
</body>
</html>
