<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05080d">
  <meta name="robots" content="noindex">
  <title>Minigames · Stardust</title>
  <meta name="description" content="Developer preview of the Stardust minigames. Not open yet.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2381e6df' d='M16 1 30 30 16 23 2 30Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../voyage.css">
  <link rel="stylesheet" href="../ui/kit.css">
  <link rel="stylesheet" href="./minigames.css">
  <link rel="stylesheet" href="./minigames-skin.css">
</head>
<body>
  <section id="mg-closed" class="vy-closed mg-closed" hidden aria-labelledby="mg-closed-title">
    <p class="vy-eyebrow">COMING LATER</p>
    <h2 id="mg-closed-title">The new Stardust is not open yet.</h2>
    <a class="vy-link" href="../../">Back to the hangar</a>
  </section>
  <div id="mg-page" class="mg-page" hidden>
    <header class="vy-top">
      <a href="../">← HANGAR</a>
      <h1 class="vy-wordmark">STARDUST <b>/</b> MINIGAMES <b>/</b> DEV PREVIEW</h1>
    </header>
    <main class="mg-dev">
      <form id="mg-controls" class="mg-controls" aria-label="Setup">
        <h2>Set it up</h2>
        <p>The game rolls a d20 and spends skill points. Set them here and see what the minigame becomes.</p>
        <label>Minigame <select id="mg-mini"><option value="repair">Repair: pipes</option><option value="hack">Hacking: mirrors and firewalls</option><option value="practice">Hacking: practice dummy lock</option><option value="haggle">Social: haggle</option><option value="persuade">Social: persuade</option><option value="intimidate">Social: intimidate</option><option value="craft">Crafting: heat and shape</option><option value="nav">Navigation: plot the lane (old)</option><option value="perihelion">Navigation: Perihelion, plot a burn</option><option value="trainer">Navigation: Perihelion trainer sector</option><option value="stealth">Stealth: shadow slip</option><option value="pilot">Piloting: touchdown</option></select></label>
        <label>d20 roll <output id="o-roll"></output><input id="roll" type="range" min="1" max="20" value="12"></label>
        <label>Skill level <output id="o-level"></output><input id="level" type="range" min="1" max="9" value="3"></label>
        <label>Difficulty (dc) <output id="o-dc"></output><input id="dc" type="range" min="6" max="20" value="12"></label>
        <label id="l-lock">Lock level (firewalls) <output id="o-lock"></output><input id="lock" type="range" min="1" max="4" value="1"></label>
        <label id="l-context">Where <select id="context"><option value="foot">On foot: a terminal</option><option value="ship">A ship's port</option><option value="combat">Ship to ship combat</option></select></label>
        <label id="l-sector">Trainer sector <output id="o-sector"></output><input id="sector" type="range" min="1" max="5" value="1"></label>
        <label id="l-time">Time points <output id="o-time"></output><input id="time" type="range" min="0" max="9" value="0"></label>
        <label id="l-size">Size points <output id="o-size"></output><input id="size" type="range" min="0" max="9" value="0"></label>
        <label id="l-quality">Quality points <output id="o-quality"></output><input id="quality" type="range" min="0" max="9" value="0"></label>
        <label id="l-haggle">Haggle points <output id="o-haggle"></output><input id="haggle" type="range" min="0" max="9" value="0"></label>
        <label id="l-persuade">Persuade points <output id="o-persuade"></output><input id="persuade" type="range" min="0" max="9" value="0"></label>
        <label id="l-intimidate">Intimidate points <output id="o-intimidate"></output><input id="intimidate" type="range" min="0" max="9" value="0"></label>
        <label id="l-handling">Handling points <output id="o-handling"></output><input id="handling" type="range" min="0" max="9" value="0"></label>
        <label id="l-boost">Boost points <output id="o-boost"></output><input id="boost" type="range" min="0" max="9" value="0"></label>
        <label id="l-landing">Landing points <output id="o-landing"></output><input id="landing" type="range" min="0" max="9" value="0"></label>
        <label id="l-speed">Speed points <output id="o-speed"></output><input id="speed" type="range" min="0" max="9" value="0"></label>
        <label id="l-material">Material points <output id="o-material"></output><input id="material" type="range" min="0" max="9" value="0"></label>
        <label id="l-fuel">Fuel points <output id="o-fuel"></output><input id="fuel" type="range" min="0" max="9" value="0"></label>
        <label id="l-warning">Warning points <output id="o-warning"></output><input id="warning" type="range" min="0" max="9" value="0"></label>
        <label id="l-quiet">Quiet points <output id="o-quiet"></output><input id="quiet" type="range" min="0" max="9" value="0"></label>
        <label id="l-range">Range points <output id="o-range"></output><input id="range" type="range" min="0" max="9" value="0"></label>
        <label id="l-decay">Decay points <output id="o-decay"></output><input id="decay" type="range" min="0" max="9" value="0"></label>
        <label id="l-retries">Retries points <output id="o-retries"></output><input id="retries" type="range" min="0" max="9" value="0"></label>
        <div id="mg-readout" class="mg-readout" aria-live="polite"></div>
        <button id="mg-go" type="submit" class="primary">Start</button>
      </form>
      <div id="mg-stage" class="mg-stage" aria-label="Minigame"></div>
    </main>
  </div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
