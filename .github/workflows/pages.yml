name: Verify and deploy DonavenCrenshaw.com

on:
  push:
    branches: ["main"]
  pull_request:
  repository_dispatch:
    types: [project-content-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DonavenCrenshaw
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout BetterFingers project source
        uses: actions/checkout@v4
        with:
          repository: RoyGSlade/BetterFingers
          ref: main
          path: project-sources/BetterFingers
          persist-credentials: false

      - name: Checkout Infinite Ages Evolved project source
        uses: actions/checkout@v4
        with:
          repository: RoyGSlade/InfiniteAgesEvolved
          ref: main
          path: project-sources/InfiniteAgesEvolved
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate BetterFingers source directly
        run: node scripts/validateProjectSource.mjs --source project-sources/BetterFingers

      - name: Validate Infinite Ages Evolved source directly
        run: node scripts/validateProjectSource.mjs --source project-sources/InfiniteAgesEvolved

      - name: Verify contracts, imported projects, site, privacy, and secrets
        env:
          PROJECT_SOURCE_ROOT: ${{ github.workspace }}/project-sources
        run: npm run verify

      - name: Require the BetterFingers page in the built artifact
        run: test -f public/projects/betterfingers/index.html

      - name: Require the Infinite Ages Evolved page in the built artifact
        run: test -f public/projects/infinite-ages-evolved/index.html

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
